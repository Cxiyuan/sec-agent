# 深瞳 · 采集侧双写管道
#
#   Zeek(Filebeat) ─┐
#                   ├→ Logstash(:5044) ─┬→ Elasticsearch（历史与界面；索引命名与改造前一致）
#   Wazuh(外部) ────┘                    └→ Redis List（旁路队列，供检测器实时消费）
#
# 说明：
# - Zeek 侧字段已由 Filebeat 收在 zeek.* 命名空间下（避免与 host/agent/ecs 撞名），此处原样转发。
# - Wazuh 侧由其自身输出到本 Logstash（beats/tcp），此处补 source_system 供后端分流。
# - ES 模板与 ILM 由深瞳后端统一下发，这里必须关掉自管理，避免互相覆盖。

input {
  beats {
    port => 5044
  }
}

filter {
  # 统一来源标记：Zeek 的 Filebeat 已带 source_system=zeek
  if ![source_system] or [source_system] == "" {
    mutate { add_field => { "source_system" => "wazuh" } }
  }
}

output {
  # 1) 写 Elasticsearch：保持既有索引命名，前端与历史查询零改动
  if [log_type] {
    elasticsearch {
      hosts => ["${ES_URL:http://elasticsearch:9200}"]
      index => "zeek-%{[log_type]}-%{+yyyy.MM.dd}"
      manage_template => false
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["${ES_URL:http://elasticsearch:9200}"]
      index => "wazuh-alerts-%{+yyyy.MM.dd}"
      manage_template => false
      ilm_enabled => false
    }
  }

  # 2) 旁路队列：检测器实时消费（List 结构；检测器用 BRPOPLPUSH 可靠取出）
  redis {
    host => "${REDIS_HOST:redis}"
    port => 6379
    db => 0
    data_type => "list"
    key => "shentong:events:raw"
  }
}
