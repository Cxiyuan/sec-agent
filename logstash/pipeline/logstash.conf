# ⚠️ 示例参考，不是实际生效的配置
#
# 实际生效的管道由**深瞳后端**在首次启动时播种、并在后台维护：
#   后台「系统配置 → 采集侧 · Logstash 管道」（参数表单 + 全文编辑）
#   文件位置：共享卷 logstash-pipeline  →  容器内 /usr/share/logstash/pipeline/pipeline.conf
#   保存后 Logstash 自动重载（config.reload.automatic，约 10 秒）
#   模板与渲染逻辑：backend/app/collector/template.py
#
# 本文件仅作「默认管道长什么样」的参考，不再被任何容器挂载。
#
#   Zeek(Filebeat) ─┐
#                   ├→ Logstash(:5044) ─┬→ Elasticsearch（历史与界面）
#   Wazuh(外部) ────┘                    └→ Redis List（旁路队列，供检测器实时消费）

input {
  beats {
    port => 5044
  }
}

filter {
  # 统一来源标记：Zeek 的 Filebeat 已带 source_system=zeek
  if ![source_system] or [source_system] == "" {
    mutate { add_field => { "source_system" => "wazuh" } }
  }
}

output {
  # 1) Elasticsearch：历史归档 + 界面/回溯查询
  if [log_type] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "zeek-%{[log_type]}-%{+yyyy.MM.dd}"
      manage_template => false
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "wazuh-alerts-%{+yyyy.MM.dd}"
      manage_template => false
      ilm_enabled => false
    }
  }

  # 2) Redis 旁路队列：检测器实时消费（List；检测器用 BRPOPLPUSH 可靠取出）
  redis {
    host => "redis"
    port => 6379
    db => 0
    data_type => "list"
    key => "shentong:events:raw"
  }
}
