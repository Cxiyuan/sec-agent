# 深瞳 · 安全分析智能体 —— 服务器部署编排
#
# 与开发用 docker-compose.yml 的区别：
#   1) 只从 GHCR 拉取镜像（不在服务器上本地构建，符合项目「只用 GitHub Actions 构建」的规则）
#   2) Zeek 抓包口默认 ens224（端口镜像/SPAN 口，本机无 IP）
#   3) CORS 默认放行本机 3000 端口来源
#
# 用法（在 /opt/shentong 下）：
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f backend
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shentong
      POSTGRES_PASSWORD: shentong
      POSTGRES_DB: shentong
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis：既是 Celery broker/结果后端，也存旁路队列、已处理登记、频率滑窗与聚合态。
  # 必须开持久化（AOF）——否则重启就丢 handled 登记，兜底任务会把已分析过的日志重分析一遍。
  # noeviction：内存满时写入报错（采集侧背压）而不是静默淘汰关键状态。
  redis:
    image: redis:7
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    image: ghcr.io/cxiyuan/sec-agent/shentong-backend:latest
    environment: &backend-env
      ST_ES_URL: http://elasticsearch:9200
      ST_PG_URL: postgresql+psycopg://shentong:shentong@postgres:5432/shentong
      ST_REDIS_URL: redis://redis:6379/0
      ST_CELERY_BROKER_URL: redis://redis:6379/1
      ST_CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 云端模型 API Key 不走环境变量：在后台「系统配置」页填写、存数据库
      ST_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ST_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Zeek 网卡配置（写共享卷，Zeek 容器看门狗读取）
      ST_ZEEK_CONF_DIR: /config
      ST_ZEEK_IFACE_CONF: /config/interface.conf
      ST_ZEEK_INTERFACES_JSON: /config/interfaces.json
    ports:
      - "8000:8000"
    volumes:
      - zeek-config:/config
      # 采集侧管道配置：后端写、Logstash 读（自动重载）
      - logstash-pipeline:/logstash
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/cxiyuan/sec-agent/shentong-backend:latest
    command: celery -A app.workers.celery_app worker -l info --concurrency=2
    environment: *backend-env
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  # 自主取证调查 worker：独立队列（-Q investigation）+ 并发 1。
  # 与实时 worker 分离：单轮调查最长 240s，混在一起会把实时分析排队到摘要超龄被丢。
  celery-investigation:
    image: ghcr.io/cxiyuan/sec-agent/shentong-backend:latest
    command: >
      celery -A app.workers.celery_app worker -l info
      -Q investigation --concurrency=1
    environment: *backend-env
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/cxiyuan/sec-agent/shentong-backend:latest
    command: celery -A app.workers.celery_app beat -l info
    environment: *backend-env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # 事件驱动检测器：消费 Redis 旁路队列，实时检测 + 短窗聚合后投递摘要给智能体
  detector:
    image: ghcr.io/cxiyuan/sec-agent/shentong-backend:latest
    command: python -m app.detector
    environment: *backend-env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # 采集侧双写：Filebeat/Wazuh → Logstash → ES（历史） + Redis（旁路队列）
  # 管道内容由后台「系统配置 → Logstash 管道」维护（后端写共享卷，本容器自动重载）
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - logstash-pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5044:5044" # Beats 输入（Zeek / Wazuh）
      - "9600:9600" # 监控 API（后端读存活/吞吐/重载统计）
    depends_on:
      - elasticsearch
      - redis
    restart: unless-stopped

  frontend:
    # 注意：后端地址在「构建时」烙进 Next 的 rewrites（默认取 compose 服务名 backend），
    # 运行时再设 BACKEND_URL 无效，故此处不声明。
    image: ghcr.io/cxiyuan/sec-agent/shentong-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Zeek 采集（内含 Filebeat，直发 ES）
  # host 网络 + NET_RAW/NET_ADMIN 才能抓宿主网卡；host 网络下访问 ES 用 localhost:9200
  zeek:
    image: ghcr.io/cxiyuan/sec-agent/shentong-zeek:latest
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      ZEEK_CONF_DIR: /config
      ZEEK_IFACE_CONF: /config/interface.conf
      ZEEK_INTERFACES_JSON: /config/interfaces.json
      ZEEK_LOG_DIR: /logs
      ZEEK_IFACE: ${ZEEK_IFACE:-ens224}
      # 采集侧改为发 Logstash（host 网络下用宿主地址）
      LOGSTASH_HOST: ${LOGSTASH_HOST:-localhost}
      LOGSTASH_PORT: ${LOGSTASH_PORT:-5044}
    volumes:
      - zeek-logs:/logs
      - zeek-config:/config
      # Filebeat 注册表持久化：不持久化的话，容器每次重建（改配置/升级镜像）都会
      # 从头重读 /logs 全部日志 → ES 重复写入 + 旁路队列洪水（生产上已踩到）
      - zeek-filebeat:/usr/local/bin/data
    restart: unless-stopped

volumes:
  es-data:
  pg-data:
  redis-data:
  zeek-logs:
  zeek-config:
  zeek-filebeat:
  logstash-pipeline:
