name: build

on:
  push:
    branches: [main]
  # 公共仓库会收到外部 PR：也要过同一套门禁（build 任务会推镜像，PR 时跳过）
  pull_request:
    branches: [main]
  workflow_dispatch:

# 连推几次时只保留最新一次：旧运行自动取消，避免并行跑同一套检查互相打架
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 顶层最小权限：默认只需要读代码。build 任务在自己的 permissions 里单独要 packages: write。
# （仓库已转公共，PR 可能来自外部，权限要收窄到"够用就好"。）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PR（尤其 fork）拿不到 packages: write，推镜像必失败 —— 只在 push/手动时构建分发
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      # 语法/缩进冒烟：这类错误以前能过 CI 并上线（教训）
      # 2026-10-20：agent 侧已换成 dsh（TypeScript/pnpm），Python 冒烟只剩 NDR。
      - name: Smoke check (syntax)
        run: |
          python -m compileall -q ndr/backend/app

      # 与 build 作业同一个 action 版本（SHA 固定，不接受浮动 tag）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # GHCR 镜像名必须全小写；GitHub 用户名可能含大写（如 Cxiyuan）
      - name: Lowercase image namespace
        id: ns
        # 输出里**带上 registry**：各 tag 只需 `${{ steps.ns.outputs.name }}/镜像:latest`，
        # 既短又不会漏前缀（2026-10-20 为了压行宽把 ghcr.io/ 弄丢过一次，构建末段推不动）
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER_BUILD_RECORD_UPLOAD=false 的必要性：
      # build-push-action 的 Post 步骤默认（该变量默认 true）会把「Build record」
      # 制品上传到 Actions 制品存储，供导入 Docker Desktop 的 Builds 视图。
      # 制品配额用尽后该上传必然失败，每次构建都刷 Failed to CreateArtifact 告警。
      # 本项目不需要该功能，关掉上传即可；流水线页面的构建摘要不受影响。
      - name: Build & push NDR backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          # 上下文是 ndr/：镜像要同时带 app/ 与 suricata/rules/builtin/
          # （检测规则页把签名规则与行为分析列在同一张表，见 app/suricata/catalog.py）
          context: ./ndr
          file: ./ndr/backend/Dockerfile
          push: true
          tags: ${{ steps.ns.outputs.name }}/shentong-ndr:latest

      # 前端 Dockerfile 需 COPY 仓库根下共享包 packages/ui，
      # 故 context 用仓库根，file 指向各自 Dockerfile。
      # 2026-10-20：agent 前端已换成 dsh web（见文末 agent-web job），
      # shentong-agent / shentong-agent-frontend 镜像不再产出。
      - name: Build & push NDR frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./ndr/frontend/Dockerfile
          push: true
          tags: ${{ steps.ns.outputs.name }}/shentong-ndr-frontend:latest

      - name: Build & push zeek
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ndr/zeek
          push: true
          # 基底版本可用 build-args 覆盖（默认 zeek/zeek:9.0）
          tags: ${{ steps.ns.outputs.name }}/shentong-zeek:latest

      # 签名引擎（Suricata）：构建期把 ET Open（MIT）规则拉下来固化进镜像。
      # 镜像名/tag 与 ndr/suricata/Dockerfile 的 SURICATA_BASE 对应，升级走一次提交。
      - name: Build & push suricata
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ndr/suricata
          push: true
          tags: ${{ steps.ns.outputs.name }}/shentong-suricata:latest

      # 智能体镜像已拆成独立 job `agent-build`（2026-10）：
      # 它 needs [agent-web, agent-plugins]，插件类型检查/单测不过就不出镜像。
      # 以前它挂在本 job 里，而本 job 没有对那两道门的 needs ——
      # 于是"插件编译失败但镜像照样推"是可能的，正属于"能过 CI 却上线才炸"那一类。

  # 回归测试 + 质量门。为什么要有这一层：
  # 以前 CI 只做 compileall 冒烟，语法过了就发镜像 —— 结果"能过 CI 却上线才炸"的错
  # 反复出现（Zeek 的 BPF 过滤器被当文件名、Filebeat 配置键名、类型判定兜底成 conn）。
  # 2026-10-20：agent 侧换成 dsh 后无 Python 后端，本 job 只覆盖 NDR 栈；
  # agent（dsh）的质量门在文末 agent-web job（CI 内全量构建）。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # 第三方依赖必须装全：pyright 在依赖缺失时会降级（导入解析不了 → 类型变 Any/None），
      # 报出的错与本地（.venv 装全了）不一致，甚至凭空多出假错。
      # 依赖清单直接从 pyproject.toml 读，免得手工维护。
      # （原先两侧各一个 pyproject，agent 侧换成 dsh 后只剩 NDR 一份。）
      - name: Create venv & install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/python - <<'PY' > /tmp/deps.txt
          import pathlib, tomllib
          deps: list[str] = []
          for path in ("ndr/backend/pyproject.toml",):
              raw = pathlib.Path(path).read_text(encoding="utf-8")
              data = tomllib.loads(raw)
              deps += data["project"]["dependencies"]
              extra = data["project"].get("optional-dependencies", {})
              deps += extra.get("dev", [])
          # pyyaml 不在依赖里但测试要用；pyright 是检查器本身
          deps += ["pyyaml", "pyright"]
          print("\n".join(dict.fromkeys(deps)))
          PY
          .venv/bin/pip install -q -r /tmp/deps.txt

      - name: Ruff
        run: .venv/bin/ruff check ndr/backend/app tests/py

      - name: Pyright
        run: .venv/bin/pyright ndr/backend/app tests/py

      # 接口文档必须与代码一致：`docs/api/README.md` 是从 OpenAPI 生成的，
      # 改了接口却忘了重跑生成器 → 前端照着旧文档对接（2026-10 已漂移过两次）。
      - name: API doc is up to date
        run: |
          .venv/bin/python scripts/gen_api_doc.py
          if ! git diff --quiet -- docs/api/README.md; then
            echo "::error::docs/api/README.md 与接口不一致"
            echo "::error::请本地跑 scripts/gen_api_doc.py 后一并提交"
            git --no-pager diff --stat -- docs/api/README.md
            exit 1
          fi

      # 部署编排文件写坏只有上线时才发现（改错过缩进/变量名）：这里只做语法校验，
      # 不解析 .env、不拉镜像、不构建。
      - name: Compose files parse
        run: |
          .venv/bin/python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          paths = ("ndr/docker-compose.yml", "ndr/docker-compose.deploy.yml")
          for path in paths:
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"跳过（不存在）: {path}")
                  continue
              try:
                  data = yaml.safe_load(p.read_text(encoding="utf-8"))
              except Exception as exc:  # noqa: BLE001
                  bad.append(f"{path}: {exc}")
                  continue
              if not isinstance(data, dict) or "services" not in data:
                  bad.append(f"{path}: 缺少 services 段")
              else:
                  print(f"OK {path}（{len(data['services'])} 个服务）")
          if bad:
              print("::error::compose 文件有问题：" + "；".join(bad))
              sys.exit(1)
          PY

      - name: Pytest (NDR)
        run: .venv/bin/python -m pytest tests/py --stack=ndr -q

      # Zeek 的 site 脚本是编译期加载的：语法/字段错误只有真跑一次才暴露。
      # 用官方镜像跑单测（与 ndr/zeek/Dockerfile 的 ZEEK_BASE 一致）。
      - name: Zeek site scripts (unit test in container)
        run: sh tests/zeek/run.sh

      # 签名引擎的配置是渲染出来的（网卡/网段/HTTP 端口）且要过 suricata -T 自检：
      # 只靠本地静态检查看不出配置能不能加载。
      - name: Suricata config & rules (self-test in container)
        run: sh tests/suricata/run.sh

  # 前端类型检查（tsc --noEmit）。比 next build 快得多，且能挡住类型错。
  # 2026-10-20：agent 前端换成 dsh 后由 agent-web job 构建，这里只剩 NDR。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspaces
        run: npm ci --no-audit --no-fund

      - name: Typecheck NDR frontend
        working-directory: ndr/frontend
        run: npx tsc --noEmit

  # agent = dsh（DeepSeek Harness）网页版：独立 pnpm monorepo（agent/dsh/ 自带
  # pnpm-workspace.yaml 与 pnpm-lock.yaml，与仓库根的 npm workspaces 互不干扰）。
  # 目录分工：agent/dsh/ 是上游 dsh 源码（保持原样便于同步对比），
  # agent/plugins/ 与 agent/skills/ 是我们开发的插件与技能（尚待落地）。
  # 按约定 agent 只在 CI 构建：冻结锁文件安装 + 全量构建
  # （原生插件 → Host/Client 库 → apps/web 前端，即 `dsh web` 服务的产物）。
  agent-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288  # v5
        with:
          version: 11.28.5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      # 严格拦截（2026-10-20 用户要求）：锁文件不一致 / 类型错 / lint 错 / 构建失败
      # 都必须红。agent 由 workbuddy 开发、我们负责提交 —— 门禁是我们唯一的防线，
      # 一旦"只报告"，坏代码会静默流进 main。
      - name: Install dependencies (frozen)
        working-directory: agent/dsh
        run: pnpm install --frozen-lockfile

      # dsh 自带 typecheck / lint（TypeScript 侧）。agent 由 workbuddy 开发、我们负责提交，
      # 这两类错误必须在合并前暴露——`pnpm run build` 只保证构建产物能出，不保证类型干净。
      # 严格拦截（2026-10 用户要求）：类型/规范错误必须红，不放行。
      - name: Typecheck dsh
        working-directory: agent/dsh
        run: pnpm run typecheck

      - name: Lint dsh
        working-directory: agent/dsh
        run: pnpm run lint

      - name: Build dsh (web)
        working-directory: agent/dsh
        run: pnpm run build

  # agent/plugins：自研 dsh 插件（独立 pnpm workspace，peer 依赖发布在 npm 的
  # @deepseek-ai 作用域包，与 dsh 源码目录物理分离）。同样只在 CI 构建验证。
  # 首个插件尚未提交锁文件，先 --no-frozen-lockfile；锁文件入库后改冻结安装。
  agent-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # xdr-ingest 的冷库是 PG（项目统一存储）：service 容器让 PG 集成测试
      # （tests/pg-store.integration.test.ts）在 CI 真实跑，账号与库名对齐
      # NDR 侧默认配置（shentong/shentong/shentong）。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shentong
          POSTGRES_PASSWORD: shentong
          POSTGRES_DB: shentong
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shentong"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288  # v5
        with:
          version: 11.28.5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: agent/plugins
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck plugins
        working-directory: agent/plugins
        run: pnpm run typecheck

      - name: Test plugins
        working-directory: agent/plugins
        env:
          XDR_TEST_PG_URL: postgresql://shentong:shentong@127.0.0.1:5432/shentong
        run: pnpm test

      - name: Build plugins
        working-directory: agent/plugins
        run: pnpm run build

  # 智能体镜像：dsh 基座 + agent/plugins 自研插件（多阶段：builder 全量构建
  # dsh monorepo 与插件，runtime bake web profile 后只带产物）。
  #
  # 为什么单独一个 job 而不是挂在 build 里：它必须 **needs** 那两道质量门 ——
  # 插件 typecheck / 单测不过就不该产出镜像。挂在 build 里做不到（build 没有、
  # 也不该有对这些 job 的依赖，否则 NDR 镜像要等 agent 的门禁）。
  agent-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [agent-web, agent-plugins]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Lowercase image namespace
        id: ns
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          # dsh 构建要盖 commit 哈希（上下文无 .git），把本次 SHA 传进去
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          # 除 latest 外再打一个本次 commit 的**不可变** tag：下面的冒烟任务用它拉镜像，
          # 否则连推两次时 latest 会被覆盖，冒烟可能在测另一份产物。
          tags: |
            ${{ steps.ns.outputs.name }}/shentong-agent:latest
            ${{ steps.ns.outputs.name }}/shentong-agent:${{ github.sha }}

  # 智能体镜像运行时冒烟：把 build job 刚推的镜像跑起来，验证整条链——
  # 镜像能起、dsh home 能种、插件 bundle 能在 Loader 里加载（路由存在即
  # 证明，pnpm 的 link: peer 警告不会咬到运行时）、PG 冷库能连、判重
  # 能复用、token 围栏有效。这是「上线不炸」的最后一道闸。
  # host 网络：容器与 postgres service 共用 runner 的 127.0.0.1。
  agent-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: agent-build
    if: github.event_name != 'pull_request'
    # 从 GHCR 拉镜像需要 packages: read（顶层默认只有 contents: read，
    # 与 build job 单独要 packages: write 同一套最小权限思路）
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shentong
          POSTGRES_PASSWORD: shentong
          POSTGRES_DB: shentong
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shentong"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DSH_WEB_HOST=127.0.0.1：冒烟只验证摄入链，loopback 绑定即可被
      # 本 job 的 curl 触达（LAN 自动绑定有单测覆盖）。
      - name: Start agent container
        run: |
          docker run -d --network host --name xdr-agent \
            -e XDR_INGEST_TOKEN=smoke-token \
            -e DSH_WEB_HOST=127.0.0.1 \
            -e XDR_INGEST_PG_URL=postgresql://shentong:shentong@127.0.0.1:5432/shentong \
            "ghcr.io/${GITHUB_REPOSITORY,,}/shentong-agent:${GITHUB_SHA}"

      # 第一层：等 dsh web 本身就绪（根路径无需认证，任何状态码都算通）。
      # 用状态码而非 curl -f——上一版把 401/404 和连不上混为一谈，白等 5 分钟。
      - name: Wait for the web root (server listening)
        run: |
          for i in $(seq 1 100); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3080/ 2>/dev/null || echo 000)
            if [ "$CODE" != "000" ]; then
              echo "web root responded $CODE after $i attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::dsh web never accepted a connection on 127.0.0.1:3080"
          docker ps -a
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' xdr-agent 2>/dev/null || true
          docker logs --tail 100 xdr-agent || true
          exit 1

      # 第二层：探 ingest 端点，逐次打状态码与响应体——路由未注册会停在 404，
      # token 不匹配会停在 401，两者根因完全不同，必须可分辨。
      - name: Wait for the ingest endpoint (plugin bundle loaded)
        run: |
          for i in $(seq 1 40); do
            OUT=$(curl -s --max-time 5 -H "Authorization: Bearer smoke-token" -w '\n%{http_code}' http://127.0.0.1:3080/xdr/ingest/ping 2>/dev/null || printf '\n000')
            CODE=$(printf '%s' "$OUT" | tail -1)
            BODY=$(printf '%s' "$OUT" | head -1)
            echo "ping attempt $i: code=$CODE body=$BODY"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::ingest endpoint did not become ready"
          exit 1

      - name: Dump profile wiring (only on failure)
        if: failure()
        run: |
          echo '--- profile package.json ---'
          docker exec xdr-agent sh -c 'cat /data/dsh/profiles/web/package.json' 2>&1 || true
          echo '--- plugin module in profile node_modules ---'
          docker exec xdr-agent sh -c 'ls -la /data/dsh/profiles/web/node_modules/@sec-agent/ 2>&1; ls /data/dsh/profiles/web/node_modules/@sec-agent/xdr-ingest/ 2>&1' || true
          echo '--- plugin source in image ---'
          docker exec xdr-agent sh -c 'ls /opt/agent/plugins/xdr-ingest/ && ls /opt/agent/plugins/xdr-ingest/lib/ 2>&1' || true
          # 组合后的 profile 树（免启动）：xdr-ingest 行在不在，直接区分
          # 「bundle 被跳过/补丁空操作」与「模块 import 失败」两种根因。
          echo '--- composed profile tree ---'
          docker exec xdr-agent sh -c 'node /opt/agent/dsh/apps/cli/lib/bin.js --profile web --dump-default-config 2>&1' > /tmp/profile-dump.txt || true
          if grep -q 'xdr-ingest' /tmp/profile-dump.txt; then
            echo 'xdr-ingest row PRESENT in composed profile:'
            grep -n -A 14 'id: xdr-ingest' /tmp/profile-dump.txt || true
          else
            echo '::error::xdr-ingest row ABSENT from composed profile (bundle skipped or patch was a no-op)'
          fi
          echo '--- recent container logs ---'
          docker logs --tail 100 xdr-agent || true

      - name: Same digest twice; the second must be reused from the PG cold store
        run: |
          ITEM='{"items":[{"event_id":"smoke-1","fingerprint":"smoke-fp","digest":{"rule":"ET SCAN Portscan","src_ip":"203.0.113.7","dst_ips":["10.0.0.5"],"dst_ports":[22,80],"event_types":["alert"],"count":5}}]}'
          FIRST=$(curl -s --max-time 15 -H "Authorization: Bearer smoke-token" -H "content-type: application/json" -d "$ITEM" -w '\n%{http_code}' http://127.0.0.1:3080/xdr/ingest/digests)
          echo "first: $FIRST"
          printf '%s' "$FIRST" | tail -1 | grep -qx 200
          printf '%s' "$FIRST" | head -1 | grep -q '"analyzed":1'
          SECOND=$(curl -s --max-time 15 -H "Authorization: Bearer smoke-token" -H "content-type: application/json" -d "$ITEM" -w '\n%{http_code}' http://127.0.0.1:3080/xdr/ingest/digests)
          echo "second: $SECOND"
          printf '%s' "$SECOND" | tail -1 | grep -qx 200
          printf '%s' "$SECOND" | head -1 | grep -q '"reused":1'

      # ---- 新架构：门铃 + 状态端点（这两条以前没有任何门禁覆盖）----
      # 门铃是 2026-10 改造后的**主路径**：NDR 只发「有新线索了」，不再推摘要。
      # 不验它，等于把新的主链路放上线才第一次跑。
      - name: Doorbell is acknowledged
        run: |
          cat > /tmp/bell.json <<'JSON'
          {"doorbell": {"queue_len": 3, "top_kind": "shift",
            "max_strength": 0.81, "watermark": "2026-10-25T10:00:00Z",
            "ts": "2026-10-25T10:00:05Z"}}
          JSON
          OUT=$(curl -s --max-time 10 -w '\n%{http_code}' \
            -H "Authorization: Bearer smoke-token" \
            -H "content-type: application/json" \
            --data @/tmp/bell.json \
            http://127.0.0.1:3080/xdr/ingest/digests)
          echo "doorbell: $OUT"
          printf '%s' "$OUT" | tail -1 | grep -qx 200
          printf '%s' "$OUT" | head -1 | grep -q '"accepted":"doorbell"'

      # 坏门铃必须 400：若回 2xx，NDR 会以为叫醒成功，线索静默积压。
      - name: Malformed doorbell is rejected with 400
        run: |
          BAD='{"doorbell":{"queue_len":"many"}}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer smoke-token" \
            -H "content-type: application/json" -d "$BAD" \
            http://127.0.0.1:3080/xdr/ingest/digests)
          if [ "$CODE" != "400" ]; then
            echo "::error::expected 400 for a malformed doorbell, got $CODE"
            exit 1
          fi

      # /status 是运维看"分析到底有没有在跑"的唯一入口。
      # 本 job 没给 XDR_NDR_MCP_TOKEN，所以必须是 disabled —— 这也顺带证明
      # "没配令牌时不假装在分析"（会显式告警，而不是静默）。
      - name: Status endpoint reports the analysis loop state
        run: |
          OUT=$(curl -s --max-time 10 -w '\n%{http_code}' \
            -H "Authorization: Bearer smoke-token" \
            http://127.0.0.1:3080/xdr/ingest/status)
          echo "status: $OUT"
          printf '%s' "$OUT" | tail -1 | grep -qx 200
          printf '%s' "$OUT" | head -1 | grep -q '"analysis":"disabled"'

      # mcp-ndr 行必须真的进了组合后的 profile：只有 id+config 的补丁是空操作。
      # 插件自己的 MCP 客户端能跑，但**模型**拿不到 mcp__ndr__* 工具，
      # 分析会话就无从取证。
      - name: MCP client row is present in the composed profile
        run: |
          BIN=/opt/agent/dsh/apps/cli/lib/bin.js
          docker exec xdr-agent sh -c \
            "node $BIN --profile web --dump-default-config" \
            > /tmp/profile-ok.txt 2>&1 || true
          if ! grep -q 'id: mcp-ndr' /tmp/profile-ok.txt; then
            echo '::error::mcp-ndr row ABSENT (the model would have no ndr tools)'
            grep -n -A 12 'id: xdr-ingest' /tmp/profile-ok.txt || true
            exit 1
          fi
          echo 'mcp-ndr row PRESENT:'
          grep -n -A 10 'id: mcp-ndr' /tmp/profile-ok.txt || true

      - name: Missing token is rejected with 401
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "content-type: application/json" -d '{"items":[]}' http://127.0.0.1:3080/xdr/ingest/digests)
          if [ "$CODE" != "401" ]; then echo "::error::expected 401, got $CODE"; exit 1; fi

      - name: Dump logs and stop the container
        if: always()
        run: |
          docker logs --tail 30 xdr-agent || true
          docker rm -f xdr-agent || true
