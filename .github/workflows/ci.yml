name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 语法/缩进冒烟：这类错误以前能过 CI 并上线（教训）
      - name: Smoke check (syntax)
        run: |
          python -m compileall -q ndr/backend/app
          python -m compileall -q agent/backend/app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR 镜像名必须全小写；GitHub 用户名可能含大写（如 Cxiyuan）
      - name: Lowercase image namespace
        id: ns
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER_BUILD_RECORD_UPLOAD=false 的必要性：
      # build-push-action 的 Post 步骤默认（该变量默认 true）会把「Build record」
      # 制品上传到 Actions 制品存储，供导入 Docker Desktop 的 Builds 视图。
      # 制品配额用尽后该上传必然失败，每次构建都刷 Failed to CreateArtifact 告警。
      # 本项目不需要该功能，关掉上传即可；流水线页面的构建摘要不受影响。
      - name: Build & push NDR backend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ndr/backend
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-ndr:latest

      - name: Build & push agent backend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./agent/backend
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-agent:latest

      # 前端 Dockerfile 需 COPY 仓库根下共享包 packages/ui，
      # 故 context 用仓库根，file 指向各自 Dockerfile。
      - name: Build & push NDR frontend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./ndr/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-ndr-frontend:latest

      - name: Build & push agent frontend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./agent/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-agent-frontend:latest

      - name: Build & push zeek
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ndr/zeek
          push: true
          # 基底版本可用 build-args 覆盖（默认 zeek/zeek:9.0）
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-zeek:latest
