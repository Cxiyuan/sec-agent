name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR 镜像名必须全小写；GitHub 用户名可能含大写（如 Cxiyuan）
      - name: Lowercase image namespace
        id: ns
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER_BUILD_RECORD_UPLOAD=false 的必要性：
      # build-push-action 的 Post 步骤默认（该变量默认 true）会把「Build record」
      # 制品上传到 Actions 制品存储，供导入 Docker Desktop 的 Builds 视图。
      # 制品配额用尽后该上传必然失败，每次构建都刷 Failed to CreateArtifact 告警。
      # 本项目不需要该功能，关掉上传即可；流水线页面的构建摘要不受影响。
      - name: Build & push backend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-frontend:latest

      - name: Build & push zeek
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./zeek
          push: true
          # 基底版本可用 build-args 覆盖（默认 zeek/zeek:9.0）
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-zeek:latest
