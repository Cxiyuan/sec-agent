name: build

on:
  push:
    branches: [main]
  # 公共仓库会收到外部 PR：也要过同一套门禁（build 任务会推镜像，PR 时跳过）
  pull_request:
    branches: [main]
  workflow_dispatch:

# 连推几次时只保留最新一次：旧运行自动取消，避免并行跑同一套检查互相打架
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 顶层最小权限：默认只需要读代码。build 任务在自己的 permissions 里单独要 packages: write。
# （仓库已转公共，PR 可能来自外部，权限要收窄到"够用就好"。）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # PR（尤其 fork）拿不到 packages: write，推镜像必失败 —— 只在 push/手动时构建分发
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      # 语法/缩进冒烟：这类错误以前能过 CI 并上线（教训）
      # 2026-10-20：agent 侧已换成 dsh（TypeScript/pnpm），Python 冒烟只剩 NDR。
      - name: Smoke check (syntax)
        run: |
          python -m compileall -q ndr/backend/app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR 镜像名必须全小写；GitHub 用户名可能含大写（如 Cxiyuan）
      - name: Lowercase image namespace
        id: ns
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER_BUILD_RECORD_UPLOAD=false 的必要性：
      # build-push-action 的 Post 步骤默认（该变量默认 true）会把「Build record」
      # 制品上传到 Actions 制品存储，供导入 Docker Desktop 的 Builds 视图。
      # 制品配额用尽后该上传必然失败，每次构建都刷 Failed to CreateArtifact 告警。
      # 本项目不需要该功能，关掉上传即可；流水线页面的构建摘要不受影响。
      - name: Build & push NDR backend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ndr/backend
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-ndr:latest

      # 前端 Dockerfile 需 COPY 仓库根下共享包 packages/ui，
      # 故 context 用仓库根，file 指向各自 Dockerfile。
      # 2026-10-20：agent 前端已换成 dsh web（见文末 agent-web job），
      # shentong-agent / shentong-agent-frontend 镜像不再产出。
      - name: Build & push NDR frontend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./ndr/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-ndr-frontend:latest

      - name: Build & push zeek
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ndr/zeek
          push: true
          # 基底版本可用 build-args 覆盖（默认 zeek/zeek:9.0）
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-zeek:latest

      # 签名引擎（Suricata）：构建期把 ET Open（MIT）规则拉下来固化进镜像。
      # 镜像名/tag 与 ndr/suricata/Dockerfile 的 SURICATA_BASE 对应，升级走一次提交。
      - name: Build & push suricata
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ndr/suricata
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.name }}/shentong-suricata:latest

  # 回归测试 + 质量门。为什么要有这一层：
  # 以前 CI 只做 compileall 冒烟，语法过了就发镜像 —— 结果"能过 CI 却上线才炸"的错
  # 反复出现（Zeek 的 BPF 过滤器被当文件名、Filebeat 配置键名、类型判定兜底成 conn）。
  # 2026-10-20：agent 侧换成 dsh 后无 Python 后端，本 job 只覆盖 NDR 栈；
  # agent（dsh）的质量门在文末 agent-web job（CI 内全量构建）。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 第三方依赖必须装全：pyright 在依赖缺失时会降级（导入解析不了 → 类型变 Any/None），
      # 报出的错与本地（.venv 装全了）不一致，甚至凭空多出假错。
      # 依赖清单直接从 pyproject.toml 读，免得手工维护。
      # （原先两侧各一个 pyproject，agent 侧换成 dsh 后只剩 NDR 一份。）
      - name: Create venv & install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/python - <<'PY' > /tmp/deps.txt
          import pathlib, tomllib
          deps: list[str] = []
          for path in ("ndr/backend/pyproject.toml",):
              data = tomllib.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              deps += data["project"]["dependencies"]
              deps += data["project"].get("optional-dependencies", {}).get("dev", [])
          # pyyaml 不在依赖里但测试要用；pyright 是检查器本身
          deps += ["pyyaml", "pyright"]
          print("\n".join(dict.fromkeys(deps)))
          PY
          .venv/bin/pip install -q -r /tmp/deps.txt

      - name: Ruff
        run: .venv/bin/ruff check ndr/backend/app tests/py

      - name: Pyright
        run: .venv/bin/pyright ndr/backend/app tests/py

      # 接口文档必须与代码一致：`docs/api/README.md` 是从 OpenAPI 生成的，
      # 改了接口却忘了重跑生成器 → 前端照着旧文档对接（2026-10 已漂移过两次）。
      - name: API doc is up to date
        run: |
          .venv/bin/python scripts/gen_api_doc.py
          if ! git diff --quiet -- docs/api/README.md; then
            echo "::error::docs/api/README.md 与当前接口不一致，请本地跑 .venv/bin/python scripts/gen_api_doc.py 并提交"
            git --no-pager diff --stat -- docs/api/README.md
            exit 1
          fi

      # 部署编排文件写坏只有上线时才发现（改错过缩进/变量名）：这里只做语法校验，
      # 不解析 .env、不拉镜像、不构建。
      - name: Compose files parse
        run: |
          .venv/bin/python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in ("ndr/docker-compose.yml", "ndr/docker-compose.deploy.yml"):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"跳过（不存在）: {path}")
                  continue
              try:
                  data = yaml.safe_load(p.read_text(encoding="utf-8"))
              except Exception as exc:  # noqa: BLE001
                  bad.append(f"{path}: {exc}")
                  continue
              if not isinstance(data, dict) or "services" not in data:
                  bad.append(f"{path}: 缺少 services 段")
              else:
                  print(f"OK {path}（{len(data['services'])} 个服务）")
          if bad:
              print("::error::compose 文件有问题：" + "；".join(bad))
              sys.exit(1)
          PY

      - name: Pytest (NDR)
        run: .venv/bin/python -m pytest tests/py --stack=ndr -q

      # Zeek 的 site 脚本是编译期加载的：语法/字段错误只有真跑一次才暴露。
      # 用官方镜像跑单测（与 ndr/zeek/Dockerfile 的 ZEEK_BASE 一致）。
      - name: Zeek site scripts (unit test in container)
        run: sh tests/zeek/run.sh

      # 签名引擎的配置是渲染出来的（网卡/网段/HTTP 端口）且要过 suricata -T 自检：
      # 只靠本地静态检查看不出配置能不能加载。
      - name: Suricata config & rules (self-test in container)
        run: sh tests/suricata/run.sh

  # 前端类型检查（tsc --noEmit）。比 next build 快得多，且能挡住类型错。
  # 2026-10-20：agent 前端换成 dsh 后由 agent-web job 构建，这里只剩 NDR。
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspaces
        run: npm ci --no-audit --no-fund

      - name: Typecheck NDR frontend
        working-directory: ndr/frontend
        run: npx tsc --noEmit

  # agent = dsh（DeepSeek Harness）网页版：独立 pnpm monorepo（agent/ 自带
  # pnpm-workspace.yaml 与 pnpm-lock.yaml，与仓库根的 npm workspaces 互不干扰）。
  # 按约定 agent 只在 CI 构建：冻结锁文件安装 + 全量构建
  # （原生插件 → Host/Client 库 → apps/web 前端，即 `dsh web` 服务的产物）。
  agent-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里（避免随 artifact/缓存外泄）
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.28.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 暂时「只报告不拦截」的原因（2026-10-20）：
      #   dsh 的 pnpm-lock.yaml 自相矛盾 —— `ERR_PNPM_INCONSISTENT_PATCH_HASH`
      #   （锁文件里记录的 patch 哈希与它自己的 patchedDependencies 不一致，通常是手工改过
      #   或合并冲突没修干净），pnpm 明确要求用 `pnpm install --no-frozen-lockfile` 修复。
      #   这是 agent 侧的存量问题，且按约定不能在本地装依赖来修；本 job 也不产出交付物
      #   （agent 已不走镜像分发），所以先不拦 main。**锁文件修好后必须去掉这里的
      #   continue-on-error**，否则 agent 的类型/构建错误会一路放行。
      - name: Install dependencies (frozen)
        working-directory: agent
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # dsh 自带 typecheck / lint（TypeScript 侧）。agent 由 workbuddy 开发、我们负责提交，
      # 这两类错误必须在合并前暴露——`pnpm run build` 只保证构建产物能出，不保证类型干净。
      # 先「只报告不拦截」跑一轮：存量问题可能不少，清干净后再去掉 continue-on-error。
      - name: Typecheck dsh (report only)
        working-directory: agent
        continue-on-error: true
        run: pnpm run typecheck

      - name: Lint dsh (report only)
        working-directory: agent
        continue-on-error: true
        run: pnpm run lint

      - name: Build dsh (web)
        working-directory: agent
        continue-on-error: true
        run: pnpm run build
