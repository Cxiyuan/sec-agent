name: agent-lockfile-repair

# 一次性修复任务（2026-10-20）：dsh 的 pnpm-lock.yaml 自相矛盾
#   ERR_PNPM_INCONSISTENT_PATCH_HASH（锁文件里记录的 patch 哈希与它自己的
#   patchedDependencies 对不上，通常是手工改过或合并冲突没修干净）。
#
# 为什么用 CI 修而不是本地修：本项目规矩是"依赖只在 CI 装"，本地禁止 pnpm/npm install。
# 这里只做一件事：用 `--no-frozen-lockfile` 重新解析出**自洽**的锁文件，验证
# `--frozen-lockfile` 能过，然后把锁文件作为 artifact 上传 —— 由人审阅后提交。
# 修好后本文件即可删除（它不该常驻）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288  # v5
        with:
          version: 11.28.5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      - name: Repair lockfile (no frozen)
        working-directory: agent
        run: pnpm install --no-frozen-lockfile

      - name: Verify frozen install now works
        working-directory: agent
        run: pnpm install --frozen-lockfile

      - name: Show lockfile diff size
        run: |
          git --no-pager diff --stat -- agent/pnpm-lock.yaml || true

      - name: Upload repaired lockfile
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pnpm-lock-repaired
          path: agent/pnpm-lock.yaml
          retention-days: 3
