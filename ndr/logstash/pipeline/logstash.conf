# ⚠️ 示例参考，不是实际生效的配置
#
# 实际生效的管道由**深瞳后端**在首次启动时播种、并在后台维护：
#   后台「系统配置 → Logstash 采集」（参数表单 + 全文编辑）
#   文件位置：共享卷 logstash-pipeline  →  容器内 /usr/share/logstash/pipeline/logstash.conf
#   保存后 Logstash 自动重载（config.reload.automatic，约 10 秒）
#   模板与渲染逻辑：ndr/backend/app/collector/template.py
#
# 本文件仅作「默认管道长什么样」的参考，不被任何容器挂载。
#
#   Zeek  Filebeat ─┐
#                   ├→ Redis List shentong:events:collect
#                            ├→ Redis List shentong:events:raw（检测器实时消费）
#                            └→ Logstash http(:8080) → Elasticsearch 统一索引
#
# 下面这段与 template.render() 的默认输出保持一致（必要时可重新生成对照）。

# 深瞳 · 采集侧入库管道（由 Web 后台维护，请勿手工编辑服务器文件）
#
#   归一化服务 --POST(JSON)--> Logstash http(:8080) → Elasticsearch 统一索引
#
# 因此这里既没有 filter 分流，也没有第二个输出。
#
# 本文件由后台「系统配置 → Logstash 采集」生成/保存；保存后 Logstash 会自动重载（约 10s）。
# 模板与参数逻辑见 ndr/backend/app/collector/template.py。

input {
  # 归一化服务批量 POST（NDJSON，一行一条）。http 输入默认「一个请求 = 一个事件」，
  # 所以必须用 json_lines 编解码器才能把一批拆成多条事件。
  http {
    port => 8080
    codec => "json_lines"
    additional_codecs => { "application/json" => "json_lines" }
    # 必须关掉 ECS 兼容（默认开启）：开了它，http 输入会往事件里塞 `user_agent.original`
    # （值就是客户端的 User-Agent 头，正常是 httpx），而我们的文档里 `user_agent` 已经是
    # 拍平后的**字符串**，两条路径冲突 → 编解码器抛 InvalidFieldSetException
    # 「Could not set field 'original' on object ''」，整条事件退化成 message 字段、
    # 丢掉全部拍平字段（2026-10 实机部署踩到，Logstash 日志一分钟几百条 WARN）。
    # 同理 ECS 还会加 http.* / url.* 等嵌套字段，与拍平后的扁平文档天然不合。
    # ⚠ 这一行必须与 template.py 的默认渲染保持一致（本文件只是它的参考快照）。
    ecs_compatibility => "disabled"
    # 请求头/对端地址默认会写成 host、headers 两个字段并入库，挪进 @metadata 丢掉
    remote_host_target_field => "[@metadata][http][remote_host]"
    request_headers_target_field => "[@metadata][http][headers]"
  }
}

filter {
  # 归一化服务已把字段拍平，这里只把**事件时间**搬到 @timestamp。
  # 不搬的话索引会按入库日期滚动，跨天补投/重放的数据会进错索引。
  if [ts] {
    date {
      match => ["ts", "ISO8601"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }
}

output {
  # 无条件入库（红线：不做任何 drop / 条件跳过）
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shentong-events-%{+yyyy.MM.dd}"
    manage_template => false
    ilm_enabled => false
  }
}
