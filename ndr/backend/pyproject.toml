[project]
name = "shentong-ndr"
version = "0.1.0"
description = "深瞳 · NDR 检测后端（日志归一化 + 规则检测 + 摘要投递）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # ES 客户端主版本必须与服务端一致（服务端用 8.x；不封顶会装成 9.x 导致全部请求 400）
    "elasticsearch>=8.15,<9",
    # 可选能力：离线地理库（.mmdb）查询，供「可视化流量」的地域 TOP5 用。
    # 没配库时不生效（app/geoip.py 懒加载），不影响其它功能。
    "geoip2>=4.8",
    "redis>=5.0",
    "httpx>=0.27",
    # MCP 服务端（智能体的取数入口）。2.x 起 FastMCP 改名为 MCPServer，
    # 代码里用的是 `from mcp.server.mcpserver import MCPServer`，别按 1.x 的老文档写。
    "mcp>=2.2,<3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
# UP017 建议用 `datetime.UTC` 别名（3.11+）。但仓库要兼容旧解析器/IDE 的 LSP
# （pyright 按 3.9 解析时会报 "UTC is unknown import symbol"），统一用
# `timezone.utc`：语义完全相同，纯风格差异，这里显式豁免。
ignore = ["UP017"]

[tool.ruff.lint.isort]
# 同一模块的 import 与 as 别名合并成一条（避免拆成多条重复 import）
combine-as-imports = true

# 依赖只在 GitHub Actions 的 Docker 里安装（项目规则禁止本地装包/构建），
# 本地 pyright 无法解析第三方包属预期，降级为 warning 不阻塞。
[tool.pyright]
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
