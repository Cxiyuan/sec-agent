# 深瞳 · 签名规则改写清单（构建镜像时交给 `suricata-update --modify-conf`）
#
# 用途：把上游签名的动作/阈值改成本环境的口径，而不改 SID（保留出处、可回查）。
# 第一版为空：先不动上游语义，避免「改了但没人知道改过」。
#
# 语法（suricata-update 支持的几种）：
#   <sid> "alert" -> "drop"                改动作（本部署是被动镜像口，一般用不到）
#   <sid> "alert tcp" -> "alert ip"        放宽协议限定
#   <sid> threshold: type limit, track by_src, count 1, seconds 60   # 加阈值
# 例（未启用，仅示例）：
#   2019401 threshold: type limit, track by_src, count 1, seconds 300
