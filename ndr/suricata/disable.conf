# 深瞳 · 签名规则关闭清单（构建镜像时交给 `suricata-update --disable-conf`）
#
# 第一版**故意为空**：删掉检测器那 48 条重叠规则之后，这些覆盖面必须由签名引擎接住，
# 凭感觉关规则会把能力关掉。正确做法是「先量再定」——上线后看一周真实告警，
# 把与保留的那 32 条内置规则「同源同窗口双报」的签名逐条关掉，并把理由写在下面。
#
# 语法（suricata-update 支持的几种）：
#   <sid>                         关掉 SID
#   <sid>:<rev>                   关掉指定版本
#   group:<group>                 关掉一个规则组（如 group:emerging-policy.rules）
#   re:<正则>                     按 msg 正则关掉、
#   1:1000-2000                   关掉 SID 区间
# 例（未启用，仅示例）：
#   2013028            # ET POLICY 某条与本项目「高频扫描连接」重复的探测签名
#   re:ET POLICY .*Dropbox  # 与本场景无关的业务类策略签名
