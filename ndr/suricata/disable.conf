# 深瞳 · 签名规则关闭清单（构建镜像时交给 `suricata-update --disable-conf`）
#
# 口径：**先量再定**。上线当天实测（2026-10-07，20 分钟窗口 6,910 条告警 ≈ 345 条/分钟）：
#
#   SURICATA STREAM * 引擎异常 ......... 6,167 条（93.5%）
#   ET INFO「服务端回显有漏洞的 OpenSSH 版本」 312 条（4.5%）
#   其余所有签名合计 ................... 431 条（6.2%）
#
# 前两类都不是攻击信号：
# ① STREAM 是镜像口非对称流/丢包造成的**引擎抱怨**（invalid timestamp / wrong ack / out of
#    window…）—— 与 Zeek 侧 `possible_split_routing`、`data_before_established` 那批「采集类
#    异常」同源。TCP 层异常我们已经有 Zeek 的 weird.log + conn_state 覆盖，这里重复且量大 100 倍。
# ② ET INFO 那条是「服务端 banner 版本」这类**配置事实**，每条 SSH 连接报一次（15 条/分钟）。
#    属资产版本核查该管的事，不适合当逐连接事件（同类口径见内置规则里删掉的「明文凭证传输」
#    「自签或异常证书」）。
#
# 留着这两类的代价是真实的：摘要通道全局只有 24 条/分钟、单规则 8 条/分钟 —— 被它们占满，
# 真正的签名命中就挤不进来（这正是我们删掉 48 条重叠规则时反复踩过的坑）。
#
# 语法（suricata-update）：`<sid>` / `<sid>:<rev>` / `group:<file>` / `re:<msg 正则>` /
# `<gid>:<sid 区间>`。下面三种写法同时给出（哪一种被忽略都不影响另一种生效）。
#
# ---------- ① SURICATA STREAM 引擎事件（stream-events.rules 全家，SID 2210000-2219999） ----------
1:2210000-2219999
re:^SURICATA STREAM
# 实测噪音最大的几条（显式列出，避免区间/正则写法在某个版本上不生效时静默漏裁）
2210044
2210010
2210045
2210046
2210029
2210016
2210050
#
# ---------- ② ET INFO 服务端 OpenSSH 版本回显（CVE-2024-6409） ----------
2054407
#
# 保留未裁：SURICATA HTTP/TLS/Applayer 的应用层异常（合计约 8 条/分钟，是有用的取证线索）、
# 以及全部 ET 攻击类签名。后续仍按「同源同窗口双报」继续按实测逐条裁剪（理由写在这里）。
