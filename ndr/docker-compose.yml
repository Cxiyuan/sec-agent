# 深瞳 · NDR 线路 —— 本地开发编排（本地 build 镜像）
#
# 与 deploy 版区别：backend/detector/frontend 用 build（本地源码），其余用镜像。
# 本线路拥有数据面 ES + Redis（agent 线路经网络访问）。
#
# 用法（在 ndr/ 下）：
#   docker compose up -d --build
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  postgres:
    # NDR 自己的库：无向量检索（不用 pgvector）
    image: postgres:16
    environment:
      POSTGRES_USER: shentong
      POSTGRES_PASSWORD: shentong
      POSTGRES_DB: shentong
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    # 契约队列总线（agent 也连这里）；本地开发用默认配置即可
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    environment: &ndr-env
      # 统一北京时间：容器日志与界面时间口径一致（数据仍按 UTC 存储）
      TZ: Asia/Shanghai
      ST_ES_URL: http://elasticsearch:9200
      ST_PG_URL: postgresql+psycopg://shentong:shentong@postgres:5432/shentong
      ST_REDIS_URL: redis://redis:6379/0
      # 管道文件名必须叫 logstash.conf（与镜像自带示例同名，才能把它覆盖掉）
      ST_LOGSTASH_PIPELINE_CONF: /logstash/logstash.conf
      # 备份必须放到别的目录（单独卷）：Logstash 会把管道目录里所有文件当配置读
      ST_LOGSTASH_PIPELINE_BACKUP: /logstash-backup/logstash.conf.bak
      ST_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ST_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Zeek 网卡配置（写共享卷，Zeek 容器看门狗读取）
      ST_ZEEK_CONF_DIR: /config
      ST_ZEEK_IFACE_CONF: /config/interface.conf
      ST_ZEEK_INTERFACES_JSON: /config/interfaces.json
      # 第 5 期：检测器命中后经 HTTP 推给智能体（地址形如 http://<agent-host>:8000/api/push/digests）
      ST_AGENT_PUSH_URL: ${NDR_AGENT_PUSH_URL:-}
      ST_AGENT_PUSH_TOKEN: ${NDR_AGENT_PUSH_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - zeek-config:/config
      - logstash-pipeline:/logstash
      # 签名引擎的规则集与状态：后端写 staging/ 与请求标记，容器校验后切到 active/，
      # 两边各写自己的文件（见 ndr/suricata/README.md 的目录约定）
      - suricata-rules:/rules
      - logstash-backup:/logstash-backup
      # Zeek 提取的明文文件（批 4）：zeek 写、后端只读（下载接口按 fuid 读它）
      - zeek-extract:/extract:ro
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  detector:
    build: ./backend
    command: python -m app.detector
    environment: *ndr-env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # 归一化服务：原始日志 → 统一结构 → 检测器队列 + Logstash → ES
  normalizer:
    build: ./backend
    command: python -m app.collector.normalizer_service
    environment: *ndr-env
    depends_on:
      - redis
      - logstash
    restart: unless-stopped

  # MCP 服务：智能体分析事件时的查询 / 调查 / 写回结论入口（独立进程独立端口）
  ndr-mcp:
    build: ./backend
    command: python -m app.mcp.server
    environment: *ndr-env
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - logstash-pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - logstash-queue:/usr/share/logstash/data
    ports:
      - "8080:8080" # 归一化服务的 http 输入（JSON / NDJSON）
      - "9600:9600" # 监控 API
    depends_on:
      - elasticsearch
    restart: unless-stopped

  frontend:
    # 共享包 packages/ui 在仓库根，故 build context 用仓库根、dockerfile 指到本 app
    build:
      context: ..
      dockerfile: ndr/frontend/Dockerfile
    environment:
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Zeek 采集（host 网络抓包，需 Linux 宿主 + NET_RAW/NET_ADMIN）
  zeek:
    image: ${ZEEK_IMAGE:-ghcr.io/cxiyuan/sec-agent/shentong-zeek:latest}
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: Asia/Shanghai
      ZEEK_CONF_DIR: /config
      ZEEK_LOG_DIR: /logs
      # 缺省网卡留空 = 采集器自动取第一块物理网卡（见 ndr/zeek/entrypoint.sh 的 auto_iface）；
      # 要指定就在 .env 里设 ZEEK_IFACE=<宿主网卡名>。
      ZEEK_IFACE: ${ZEEK_IFACE:-}
      # 采集侧发 Redis 采集队列（host 网络下用宿主地址）
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY: ${REDIS_KEY:-shentong:events:collect}
    volumes:
      - zeek-logs:/logs
      - zeek-config:/config
      - zeek-filebeat:/usr/local/bin/data
      # 明文文件提取件（批 4）：Zeek 写入，后端只读挂载下载
      - zeek-extract:/extract
      # 可扩展脚本目录：开发线挂宿主目录，放 *.zeek 后 `docker compose restart zeek` 即生效
      # （入口的 render_scripts_loader 启动时重新生成加载器）。deploy 线没有源码目录，
      # 只能把脚本提交进仓库、走 GitHub Actions 出镜像。
      - ./zeek/scripts.d:/usr/local/zeek/share/zeek/site/scripts.d
    restart: unless-stopped

  # 签名引擎（Suricata）：只输出命中规则的事件（EVE alert），与 Zeek 共用同一份网卡/网段
  # 配置（界面「监控网段」页维护的那份），告警落在同一个 zeek-logs 卷的 suricata/ 子目录里，
  # 由 Zeek 容器里的 Filebeat 一起投递 → 同一条归一化/入库/检测链路。
  # 不发布任何端口：它只抓包、写文件，不对外提供服务（deploy 侧的暴露检查会盯着这一点）。
  suricata:
    image: ${SURICATA_IMAGE:-ghcr.io/cxiyuan/sec-agent/shentong-suricata:latest}
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: Asia/Shanghai
      SURICATA_CONF_DIR: /config
      SURICATA_LOG_DIR: /logs
      # 缺省留空 = 用共享配置 interface.conf 里的 interface；要单独指定网卡就在 .env 里
      # 设 SURICATA_IFACE=<宿主网卡名>（网卡名属客户环境，不写死在代码里）。
      SURICATA_IFACE: ${SURICATA_IFACE:-}
    volumes:
      - zeek-logs:/logs
      # 只读挂共享采集配置：网卡/网段/按 TLS 解析的端口都来自这一份
      - zeek-config:/config:ro
      # 规则集与状态（见 README：后端写 staging/ 与请求标记，本容器校验后切 active/）
      - suricata-rules:/rules
    restart: unless-stopped

volumes:
  es-data:
  pg-data:
  zeek-logs:
  zeek-config:
  zeek-filebeat:
  zeek-extract:
  # 签名引擎规则集与状态（后端 rw + 容器 rw，各写自己的文件）
  suricata-rules:
  logstash-pipeline:
  logstash-backup:
  logstash-queue:
