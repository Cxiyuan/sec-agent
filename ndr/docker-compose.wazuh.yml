# 深瞳 · NDR —— Wazuh 4.14 接入编排（内置服务：**部署编排默认包含本文件**）
#
# 用法：
#   # 部署（NDR 服务器）：deploy 编排已 include 本文件，一条命令就带起来
#   docker compose -f docker-compose.deploy.yml up -d
#
#   # 本地开发：默认编排不含 Wazuh，要接就显式叠加
#   docker compose -f docker-compose.yml -f docker-compose.wazuh.yml up -d
#
# 这个文件只加两个服务：
#   wazuh-manager  —— 官方 Wazuh manager 镜像（**不含** indexer 与 dashboard）
#   wazuh-filebeat —— 官方 Filebeat 镜像，只读挂载 manager 的日志卷，
#                     把 alerts.json / archives.json 投进 Redis 采集队列
#
# 采集链路与 Zeek 那条线一致（同一套投递形状，2026-10 QA 后对齐）：
#   wazuh-filebeat → Redis(shentong:events:collect) → normalizer → 检测器 + Logstash → ES
#   共用同一份 queue.disk 落盘队列 + 命名卷持久化读取注册表（见 wazuh-filebeat.volumes）：
#   不持久化的话每次重建都会从头重读全部 alerts.json → 重复入库 + Redis 队列洪水。
#
# 为什么不复用 manager 自带的 Filebeat：它是为「发往 Wazuh indexer」预设的，而
# 「4.14 自带的 Filebeat 能不能配 output.redis」没有实机验证过（README §三 的老问题）。
# 单独起一个 Filebeat 用我们自己的 wazuh/filebeat.yml，行为可控、与 Zeek 线一致。
#
# ── 实测记录（2026-10-03，172.16.196.77）──────────────────────────────────
#   · 卷清单已按官方 4.14.8 single-node 编排对齐：agentless / wodles 两个目录必须
#     各自挂卷，`etc/shared` **不能**单独挂（它就在 etc 卷里，嵌套挂载会遮蔽 etc 卷）
#   · API_USERNAME / API_PASSWORD 在 manager 镜像上确实生效（官方编排同样只靠这两个
#     环境变量建 API 用户）；口令必须满足 Wazuh 复杂度要求，否则首次启动 API 起不来
#   · manager 自带的 Filebeat 在缺 indexer 时只是报错重试，不影响 manager 与采集线
# ──────────────────────────────────────────────────────────────────────────
services:
  wazuh-manager:
    image: ${WAZUH_IMAGE:-wazuh/wazuh-manager:4.14.8}
    hostname: wazuh-manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      TZ: Asia/Shanghai
      # 这一组就是深瞳后台连 API 用的凭据（`docker-compose.deploy.yml` 把它映射成
      # 后台的 ST_WAZUH_API_USER / ST_WAZUH_API_PASSWORD）：同一份 .env 同时喂 manager
      # 与后台，**没有第二处要填**，界面只显示状态。注意别把默认口令带到生产。
      API_USERNAME: ${WAZUH_API_USER:-wazuh-wui}
      API_PASSWORD: ${WAZUH_API_PASSWORD:-change-me-wazuh-api}
      # 本叠加编排不带 Wazuh indexer / dashboard：manager 自带的 Filebeat 会因为
      # 没有 indexer 一直报连接失败（不影响 manager 与我们的采集线）。已有 indexer
      # 的环境可把下面三项打开指向它。
      # INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      # INDEXER_USERNAME: ${WAZUH_INDEXER_USER:-}
      # INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
    ports:
      - "55000:55000"   # Wazuh API（深瞳 NDR 后台调用：状态 / agents / 规则下发）
      - "1514:1514"     # agent 事件上报（按需；不需要就别开）
      - "1515:1515"     # agent 注册（按需）
    volumes:
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-api-config:/var/ossec/api/configuration
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      # 下面两个目录官方编排也各自挂卷：wodles 放解码器脚本、agentless 放免 agent 采集脚本
      - wazuh-wodles:/var/ossec/wodles
      - wazuh-agentless:/var/ossec/agentless

  wazuh-filebeat:
    # 与 ES / Zeek 侧一致的 8.15.3
    image: ${WAZUH_FILEBEAT_IMAGE:-docker.elastic.co/beats/filebeat:8.15.3}
    restart: unless-stopped
    user: root                 # 日志卷属于 wazuh 用户，只读也要能读
    command: ["filebeat", "-e", "-strict.perms=false", "-c", "/usr/share/filebeat/wazuh.yml"]
    environment:
      WAZUH_LOG_DIR: /var/ossec/logs
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_KEY: shentong:events:collect
      # 默认只收告警；原始日志（logall_json）量级大得多，要用再打开。
      # ⚠ 打开需要两步：manager 侧跑 wazuh/enable-logall.sh，且这里（.env）设
      #   WAZUH_ARCHIVES_ENABLED=true 后重启 wazuh-filebeat；只做前者则 archives.json
      #   被写出来也不会上报。
      WAZUH_ARCHIVES_ENABLED: ${WAZUH_ARCHIVES_ENABLED:-false}
    volumes:
      - ./wazuh/filebeat.yml:/usr/share/filebeat/wazuh.yml:ro
      - wazuh-logs:/var/ossec/logs:ro
      # Filebeat 读取注册表 + queue.disk 落盘队列（path.data 默认 /usr/share/filebeat/data）。
      # 与 Zeek 线的 zeek-filebeat 卷同理：不持久化 → 容器每次重建都从头重读全量日志，
      # 重复投递 + Redis 队列洪水（生产上已踩到）。
      - wazuh-filebeat:/usr/share/filebeat/data
    depends_on:
      - wazuh-manager
      - redis

volumes:
  # Filebeat 读取注册表 / 落盘队列（wazuh-filebeat 服务用）
  wazuh-filebeat:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-api-config:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-wodles:
  wazuh-agentless:
