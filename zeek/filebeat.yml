# Filebeat：把 Zeek 的 JSON 日志发运到 Elasticsearch
# 索引名按日志类型分（zeek-conn-yyyy.MM.dd 等）；索引模板与 ILM 由深瞳后端统一维护。

filebeat.inputs:
  - type: filestream
    id: zeek-logs
    enabled: true
    # Zeek 独立模式：活动日志在顶层，轮转后进日期子目录
    paths:
      - ${ZEEK_LOG_DIR:/logs}/*.log
      - ${ZEEK_LOG_DIR:/logs}/*/*.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    # 与 normalizer 的 source_system 对齐
    fields:
      source_system: zeek
    fields_under_root: true
    clean_removed: true
    close_removed: true

processors:
  # 从路径提取日志类型：/logs/conn.log -> conn；/logs/2026-09-23/conn.14-00-00.log -> conn
  # 注意①：filestream 输入只提供 log.file.path（没有 log.file.name）
  # 注意②：本镜像的 Filebeat 构建不含 grok 处理器，故用 JS script 处理器取文件名
  - script:
      lang: javascript
      source: >
        function process(event) {
          var p = event.Get("log.file.path") || "";
          var parts = p.split("/");
          var nm = parts[parts.length - 1] || "";
          var t = nm.split(".")[0];
          if (t) { event.Put("log_type", t); }
        }
  - drop_event:
      when:
        not:
          has_fields: ["log_type"]

output.elasticsearch:
  hosts: ["${ES_URL:http://localhost:9200}"]
  username: "${ES_USER:}"
  password: "${ES_PASSWORD:}"
  index: "zeek-%{[log_type]}-%{+yyyy.MM.dd}"

# 模板与 ILM 由深瞳后端下发，避免两边互相覆盖
setup.template.enabled: false
setup.ilm.enabled: false

logging.level: warning
logging.to_stderr: true
