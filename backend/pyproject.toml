[project]
name = "shentong-backend"
version = "0.1.0"
description = "深瞳 · 安全分析智能体 后端（LangGraph + FastAPI + Celery）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # ES 客户端主版本必须与服务端一致（服务端用 8.x；不封顶会装成 9.x 导致全部请求 400）
    "elasticsearch>=8.15,<9",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# 报告模板等非 .py 数据文件必须显式声明，否则 pip install 打 wheel 时会丢失
[tool.setuptools.package-data]
"app.reports" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
# 同一模块的 import 与 as 别名合并成一条（避免拆成多条重复 import）
combine-as-imports = true

# 依赖只在 GitHub Actions 的 Docker 里安装（项目规则禁止本地装包/构建），
# 本地 pyright 无法解析第三方包属预期，降级为 warning 不阻塞。
[tool.pyright]
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
