# 智能体线路 · OpenCode 免费模型桥接（可选 sidecar）
#
# 用途：把宿主机上已有的 OpenCode 免费模型包装成 OpenAI 兼容接口，给 dsh 当模型通道。
#
# 为什么连宿主机 OpenCode（2026-10-30 实测）：
# - 免费模型资格按“安装身份”算：镜像里新起的隔离 opencode 一律 429，宿主机这个
#   已有安装正常；会话权限设成 `deny` 也会触发 429，所以用 `ask` + 桥接层拒绝审批。
# - 因此桥接不再自己拉起 opencode（镜像里的二进制保留作离线兜底），而是通过
#   host 网络访问宿主机 127.0.0.1:49374 的 OpenCode 服务。
#
# 网络：host 网络 + 只绑 Docker 网关 172.20.0.1（agent 容器可访问，LAN 不可达）。
# 与主 compose 一起用：
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up -d

services:
  ow-bridge:
    image: ${OW_BRIDGE_IMAGE:-ghcr.io/cxiyuan/sec-agent/shentong-ow-bridge:latest}
    network_mode: host
    depends_on:
      - agent
    environment:
      TZ: Asia/Shanghai
      BRIDGE_PORT: "41980"
      # 只绑 Docker 网关：不暴露到 LAN，agent 容器用 http://172.20.0.1:41980/v1
      BRIDGE_HOST: ${OW_BRIDGE_BIND:-172.20.0.1}
      BRIDGE_HEALTH_HOST: ${OW_BRIDGE_BIND:-172.20.0.1}
      BRIDGE_API_KEY: ${OW_BRIDGE_KEY:?请在 .env 设置 OW_BRIDGE_KEY（dsh 里填同一个值）}
      BRIDGE_DATA_DIR: /data
      BRIDGE_MAX_CONCURRENCY: "2"
      BRIDGE_MAX_REQUESTS_PER_DAY: ${OW_BRIDGE_DAILY_BUDGET:-200}
      BRIDGE_TIMEOUT_MS: "300000"
      # 连宿主机 OpenCode（只读密码文件；不碰它的配置/数据）
      BRIDGE_OPENCODE_URL: "http://127.0.0.1:49374"
      # 宿主机 OpenCode 的服务密码（/root/.config/opencode/service.json 里的 password）。
      # 用环境变量而不是挂文件：容器以 node 用户运行，读不了 600 的 root 文件。
      BRIDGE_OPENCODE_PASSWORD: ${OW_BRIDGE_OPENCODE_PASSWORD:?请在 .env 设置宿主机 OpenCode 服务密码}
      BRIDGE_OPENCODE_AGENT: ""
      # ask：原生动作挂起 → 桥接层立刻拒绝；deny 会触发免费层 429，别改。
      BRIDGE_OPENCODE_PERMISSIONS: "ask"
      BRIDGE_OPENCODE_VERSION: "2.0.18"
    volumes:
      - ow-bridge-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const h=process.env.BRIDGE_HEALTH_HOST||'127.0.0.1';
          fetch('http://'+h+':'+(process.env.BRIDGE_PORT||41980)+'/health')
            .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ow-bridge-data:
