# xdr-ingest bundle patch：插入 NDR 摘要接收插件的 Loader 行并给出默认配置。
#
# 行格式与 dsh in-tree bundle 一致：`insert` + `name` 才真正把插件挂进
# Loader（name 是可解析的包名，这里指向本包自身，exports["."] → lib/index.js）。
# 只有 `id` + `config` 的补丁只能改写「已存在行」的配置——没有任何层插入过
# 这个 id 的行时，整个补丁是空操作，路由根本不注册（容器里 404 的根因）。
#
# 之后部署层（profile 自己的 cordis.patch.yml / --patch overlay）仍可按
# `id: xdr-ingest` 整行复述配置做覆盖，后写覆盖先写。
#
# token 不能留空（插件加载时拒绝启动）：默认走 XDR_INGEST_TOKEN 环境变量缝，
# 也可在部署 patch / web 设置页直接写定值，但注意 patch 明文不入库。
#
# pgUrl 留空 = 仅内存冷库（开发/测试兜底，重启丢判重结果）；生产必须指向
# 项目统一 PG。默认走 XDR_INGEST_PG_URL 环境变量缝。Node 的 pg 驱动不吃
# SQLAlchemy 的 +psycopg 后缀，连接串形如
# postgresql://shentong:shentong@localhost:5432/shentong。

- insert:
    - id: xdr-ingest
      name: '@sec-agent/xdr-ingest'
      config:
        basePath: /xdr/ingest
        token: !!js process.env.XDR_INGEST_TOKEN ?? ''
        maxBodyBytes: 4194304
        resultTtlHours: 24
        pgUrl: !!js process.env.XDR_INGEST_PG_URL ?? ''
        # 项目组织：授权ID（= NDR 的 8 位 ID）。留空 = 启动时调 server_info 自动取。
        projectId: !!js process.env.XDR_PROJECT_ID ?? ''
        projectName: !!js process.env.XDR_PROJECT_NAME ?? ''
        # 告警 webhook（项目不可达/授权ID不一致/熔断时 POST JSON；留空 = 只写日志）
        alertWebhookUrl: !!js process.env.XDR_ALERT_WEBHOOK_URL ?? ''
        hotMaxEntries: 5000
        hotThreshold: 2
        warmupLimit: 1000
        pruneIntervalMinutes: 60
        # ---- 派工闭环（新架构）----
        # NDR 的 MCP 地址：默认走容器服务名；analyst 档（22 个工具）够完整闭环，
        # 排查时人工连 /mcp/full 拿全量 43 个。
        mcpUrl: !!js process.env.XDR_NDR_MCP_URL ?? 'http://ndr-mcp:8090/mcp'
        # 令牌来自 NDR 界面生成（stmcp_ 前缀）。留空 = 只回执门铃、不跑分析（会显式告警）。
        mcpToken: !!js process.env.XDR_NDR_MCP_TOKEN ?? ''
        # 门铃会丢（重启/网络），所以必须还有一条自轮询兜底
        pollSeconds: 900
        maxConcurrent: 2
        claimLimit: 2
        analysisTimeoutSeconds: 1200
        doorbellDebounceMs: 3000
        backoffMaxMs: 300000
        # 留空 = 用 dsh 部署已配置的默认模型
        provider: ''
        model: ''
        # ---- 智能体侧记忆（结论复用 + 脚本库）----
        # 同类现象在有效期内直接复用上次结论（不起会话）；0 = 关闭复用。
        taskReuseTtlHours: 24
        # 新线索强度比上次高这么多就必须重查（现象变强）。
        taskReuseStrengthDelta: 0.15
        # 脚本库：单条正文上限（字节）与检索默认条数。
        scriptMaxCodeBytes: 65536
        scriptMaxResults: 5

# NDR 的 MCP 服务（analyst 档）：把 22 个工具暴露给模型，命名形如 mcp__ndr__claim_tasks。
# 为什么要单独一行而不是复用上面的配置：dsh 的 mcp-client 是**独立插件**，
# 一个 entry 对应一个 MCP 服务；命名空间固定进工具名，换服务名等于换一套工具名。
- insert:
    - id: mcp-ndr
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ndr
        transport: streamable-http
        url: !!js process.env.XDR_NDR_MCP_URL ?? 'http://ndr-mcp:8090/mcp'
        headers:
          Authorization: !!js '`Bearer ${process.env.XDR_NDR_MCP_TOKEN ?? ""}`'
        # 分析里偶尔会有慢查询（大时间窗聚合），给足 120 秒
        toolCallTimeoutMs: 120000
        # 连不上**不阻断启动**：智能体要能在 NDR 短暂不可用时照常起来并自动重连。
        # 静默风险由两处兜住：mcp-client 自己会记错误日志，插件 /status 也会暴露
        # 领取失败的连续次数（loop.consecutiveErrors）。反过来若设 true，
        # NDR 一次重启就会让整个 harness 起不来 —— 那是可用性事故。
        failOnStartupError: false
