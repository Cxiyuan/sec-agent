# 深瞳 · 智能体（agent）线路 —— dsh web + xdr 自研插件的容器编排。
#
# 与 ndr/ 线路的分工（对应 ndr/docker-compose.yml 顶部的说明）：
#   - 数据面（ES / Redis / 统一 PG）归 ndr 线路，本线路经网络互访；
#   - 冷库 PG 默认走宿主机上 ndr 栈发布的 5432（host.docker.internal），
#     不另起库——项目统一使用 PG，一份数据两个线路共用；
#   - NDR 检测器命中后经 HTTP 推给本线路：ndr 侧 ST_AGENT_PUSH_URL 指向
#     http://<宿主机IP>:3080/xdr/ingest/digests，token 两侧一致；
#   - 插件自带两级缓存（内存热层 + PG 冷层），不需要 Redis。
#
# 用法（在 agent/ 下）：
#   cp .env.example .env   # 至少填 AGENT_PUSH_TOKEN（与 NDR 侧一致）
#   docker compose up -d --build   # 本地构建镜像（开发）
#   docker compose up -d           # 拉取 GHCR 镜像（部署，CI 已推 shentong-agent:latest）
services:
  agent:
    build: .
    image: ${AGENT_IMAGE:-ghcr.io/cxiyuan/sec-agent/shentong-agent:latest}
    environment:
      TZ: Asia/Shanghai
      # 与 NDR 侧 agent_push.token 一致（ndr 的 ST_AGENT_PUSH_TOKEN）
      XDR_INGEST_TOKEN: ${AGENT_PUSH_TOKEN:?请在 .env 设置 AGENT_PUSH_TOKEN（与 NDR 侧 agent_push.token 一致）}
      # 统一 PG：默认宿主机 ndr 栈发布口；Node pg 连接串不带 +psycopg 后缀
      XDR_INGEST_PG_URL: ${XDR_INGEST_PG_URL:-postgresql://shentong:shentong@host.docker.internal:5432/shentong}
      # NDR 的 MCP（analyst 档 16 个工具）。令牌是 NDR 控制台签发的 stmcp_ 串；
      # 留空时门铃照收但不起分析会话（启动日志会明确告警）。
      XDR_NDR_MCP_URL: ${XDR_NDR_MCP_URL:-}
      XDR_NDR_MCP_TOKEN: ${XDR_NDR_MCP_TOKEN:-}
      # 信任围栏放行的 authority：浏览器经发布口访问时 Host 不是容器绑定 IP，
      # 把访问方用的主机名/IP 声明在这里（不带端口 = 任意端口；LAN 直接访问
      # 容器 IP 的场景不需要，绑定 IP 本身就在放行名单里）
      AGENT_TRUSTED_HOSTS: ${AGENT_TRUSTED_HOSTS:-host.docker.internal}
      # 留空 = 自动绑定容器内第一块非内部 IPv4；要指定具体 IP 时填
      DSH_WEB_HOST: ${DSH_WEB_HOST:-}
      # web 界面登录（原生界面 /login 与工作台 /xdr/ui/login 共用这组缝）：
      # 不设 = 默认 admin/admin123；设了就两处同时变
      DSH_WEB_AUTH_USER: ${DSH_WEB_AUTH_USER:-}
      DSH_WEB_AUTH_PASSWORD: ${DSH_WEB_AUTH_PASSWORD:-}
      # 固定 web 登录令牌（重启不再换 token 维持登录 URL 稳定），同时也是
      # 工作台会话签名密钥的兜底缝——不设时启动日志会提示
      DSH_WEB_LAUNCH_TOKEN: ${DSH_WEB_LAUNCH_TOKEN:-}
    extra_hosts:
      # 让容器能解析宿主机地址（连宿主机上 ndr 栈发布的 PG）
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENT_PORT:-3080}:3080"
    volumes:
      # dsh home：profile / 会话历史 / 插件管理状态；分析结果在统一 PG 里
      - dsh-home:/data/dsh
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

# 独立部署（不接 ndr 栈）时的本地 PG：取消下面注释，并把
# XDR_INGEST_PG_URL 改成 postgresql://shentong:shentong@postgres:5432/shentong。
# 账号与库名对齐 NDR 侧默认配置，将来若并入统一栈数据可直接迁移。
# postgres:
#   image: postgres:16
#   environment:
#     POSTGRES_USER: shentong
#     POSTGRES_PASSWORD: shentong
#     POSTGRES_DB: shentong
#   ports:
#     - "5432:5432"
#   volumes:
#     - pg-data:/var/lib/postgresql/data
#   restart: unless-stopped

volumes:
  dsh-home:
# pg-data:
