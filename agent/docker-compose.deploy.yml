# 深瞳 · 智能体线路 —— 服务器部署编排（深度分析 + 调查 + 报告）
#
# 本线路不拥有 Elasticsearch / Redis：这两者是 NDR 线路的「数据面」，
# 经网络访问（同机部署用 localhost，跨机部署把 NDR_MCP_URL / NDR_REDIS_URL 等
# 环境变量指到 NDR 主机）：
#   - **接收 NDR 的 HTTP 推送**：POST /api/push/digests（令牌 ST_PUSH_TOKEN，须与 NDR 侧一致）；
#     旧的 Redis 交接（shentong:events:dispatch / analyzed:done）与 consumer 进程已退役
#   - NDR 的 MCP 服务 `:8090/mcp`：事件查询 / 回溯取证的唯一取数入口
#     （智能体不再直连 ES；令牌在 NDR 后台「系统配置 → MCP」生成，填进 NDR_MCP_TOKEN）
#   - Redis db1/db2：Celery broker / 结果后端（复用同一 Redis 实例，不同 DB）
#
# 用法（在 agent/ 下）：
#   NDR_MCP_URL=http://<ndr-host>:8090/mcp \
#   NDR_MCP_TOKEN=<NDR 后台生成的令牌> \
#   NDR_REDIS_URL=redis://<ndr-host>:6379/0 \
#   PUSH_TOKEN=<与 NDR「系统配置 → 智能体推送」里填的令牌一致> \
#   docker compose -f docker-compose.deploy.yml up -d
services:
  postgres:
    # 智能体自己的库（pgvector 支持 KnowledgeChunk 向量检索）：21 张表，
    # 与 NDR 的 postgres 完全独立（各自 User 表、各自登录）。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shentong
      POSTGRES_PASSWORD: shentong
      POSTGRES_DB: shentong
    ports:
      - "5433:5432" # 宿主 5433 → 容器 5432，与 NDR 线路宿主的 5432 错开（同机部署时）
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ghcr.io/cxiyuan/sec-agent/shentong-agent:latest
    environment: &agent-env
      # 统一北京时间：容器日志与界面时间口径一致（数据仍按 UTC 存储）
      TZ: Asia/Shanghai
      ST_MCP_URL: ${NDR_MCP_URL:-http://localhost:8090/mcp}
      ST_MCP_TOKEN: ${NDR_MCP_TOKEN:-}
      # 第 5 期：接收 NDR 的 HTTP 推送（与 NDR 侧 NDR_AGENT_PUSH_TOKEN 一致；空 = 拒绝所有推送）
      ST_PUSH_TOKEN: ${PUSH_TOKEN:-}
      ST_PG_URL: postgresql+psycopg://shentong:shentong@postgres:5432/shentong
      ST_REDIS_URL: ${NDR_REDIS_URL:-redis://localhost:6379/0}
      ST_CELERY_BROKER_URL: ${NDR_CELERY_BROKER_URL:-redis://localhost:6379/1}
      ST_CELERY_RESULT_BACKEND: ${NDR_CELERY_RESULT_BACKEND:-redis://localhost:6379/2}
      ST_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ST_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # 边缘模型（本地 llama-server）连接信息：**由部署环境给**（代码里不再写死客户环境的
      # 密钥与模型文件路径 —— 2026-10 硬编码审计）；IP 在界面「边缘模型」填。
      ST_EDGE_API_KEY: ${EDGE_API_KEY:-}
      ST_EDGE_MODEL_NAME: ${EDGE_MODEL_NAME:-}
      ST_EDGE_PORT: ${EDGE_PORT:-8080}
      ST_EDGE_BASE_PATH: ${EDGE_BASE_PATH:-/v1}
    ports:
      - "8001:8000" # 宿主 8001 → 容器 8000，与 NDR 线路宿主的 8000 错开（同机部署时）
    depends_on:
      - postgres
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/cxiyuan/sec-agent/shentong-agent:latest
    command: celery -A app.workers.celery_app worker -l info --concurrency=2
    environment: *agent-env
    depends_on:
      - postgres
    restart: unless-stopped

  # 自主取证调查 worker：独立队列（-Q investigation）+ 并发 1。
  # 与实时 worker 分离：单轮调查最长 240s，混在一起会把实时分析排队到摘要超龄被丢。
  celery-investigation:
    image: ghcr.io/cxiyuan/sec-agent/shentong-agent:latest
    command: >
      celery -A app.workers.celery_app worker -l info
      -Q investigation --concurrency=1
    environment: *agent-env
    depends_on:
      - postgres
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/cxiyuan/sec-agent/shentong-agent:latest
    command: celery -A app.workers.celery_app beat -l info
    environment: *agent-env
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    # 注意：后端地址在「构建时」烙进 Next 的 rewrites（默认取 compose 服务名 backend），
    # 运行时再设 BACKEND_URL 无效，故此处不声明。
    image: ghcr.io/cxiyuan/sec-agent/shentong-agent-frontend:latest
    environment:
      TZ: Asia/Shanghai  # 服务端渲染与容器日志统一北京时间
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg-data:
