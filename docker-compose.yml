services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shentong
      POSTGRES_PASSWORD: shentong
      POSTGRES_DB: shentong
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment: &backend-env
      ST_ES_URL: http://elasticsearch:9200
      ST_PG_URL: postgresql+psycopg://shentong:shentong@postgres:5432/shentong
      ST_REDIS_URL: redis://redis:6379/0
      ST_CELERY_BROKER_URL: redis://redis:6379/1
      ST_CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 云端模型 API Key 不走环境变量：在后台「系统配置」页填写、存数据库
      ST_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ST_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Zeek 网卡配置（写共享卷，Zeek 容器看门狗读取）
      ST_ZEEK_CONF_DIR: /config
      ST_ZEEK_IFACE_CONF: /config/interface.conf
      ST_ZEEK_INTERFACES_JSON: /config/interfaces.json
    ports:
      - "8000:8000"
    volumes:
      - zeek-config:/config
    depends_on:
      - postgres
      - redis
      - elasticsearch

  celery-worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -l info --concurrency=2
    environment: *backend-env
    depends_on:
      - postgres
      - redis
      - elasticsearch

  # 自主取证调查 worker：独立队列（-Q investigation）+ 并发 1
  # 为什么不共用实时 worker：单轮调查最长 240s，会占死实时分析的槽位，
  # 导致检测器投递的摘要在队列里排队超龄被丢。
  celery-investigation:
    build: ./backend
    command: >
      celery -A app.workers.celery_app worker -l info
      -Q investigation --concurrency=1
    environment: *backend-env
    depends_on:
      - postgres
      - redis
      - elasticsearch

  celery-beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat -l info
    environment: *backend-env
    depends_on:
      - postgres
      - redis

  frontend:
    # 后端地址在构建时烙进 rewrites（默认 backend:8000，见 next.config.mjs）
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Zeek 采集（内含 Filebeat，直发 ES）
  # 注意：host 网络 + NET_RAW/NET_ADMIN 才能抓宿主网卡，需 Linux 宿主；
  #      因此访问 ES 请用宿主可达地址（不要用 compose 内部服务名）。
  zeek:
    image: ${ZEEK_IMAGE:-ghcr.io/cxiyuan/sec-agent/shentong-zeek:latest}
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      ZEEK_CONF_DIR: /config
      ZEEK_IFACE_CONF: /config/interface.conf
      ZEEK_INTERFACES_JSON: /config/interfaces.json
      ZEEK_LOG_DIR: /logs
      ES_URL: ${ZEEK_ES_URL:-http://localhost:9200}
      ES_USER: ${ES_USER:-}
      ES_PASSWORD: ${ES_PASSWORD:-}
    volumes:
      - zeek-logs:/logs
      - zeek-config:/config
    restart: unless-stopped

# 说明：Wazuh（主机事件采集）与 LLM 模型运行环境（llama.cpp / one-api 等）不属于本项目，
# 由外部部署。本项目通过 ST_EDGE_MODEL_BASE_URL / ST_CLOUD_MODEL_BASE_URL 对接模型，
# 通过 ES 读取 Zeek / Wazuh 日志。
#
# Zeek 采集镜像（zeek/）需要 Linux 宿主：host 网络 + NET_RAW/NET_ADMIN 才能抓宿主网卡。

volumes:
  es-data:
  pg-data:
  zeek-logs:
  zeek-config:
